name: recon

# Membongkar Bunny Loader v0.4.0 (ARM64) untuk port 32-bit.
# v2: dipecah jadi 3 job supaya hasil satu bagian tidak hilang kalau bagian lain gagal.
#   managed -> recon-managed.zip (C# dari BunnyLoader.dll + Java/Kotlin dari dex)
#   native  -> recon-native.zip  (libbunny.so didekompilasi Ghidra jadi C)
# Semua hasil masuk ke release "recon-output".
# Jalankan manual: tab Actions -> recon -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: Bunnyloader32bitproject

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Siapkan release recon-output
        run: |
          gh release view recon-output -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create recon-output -R "$GITHUB_REPOSITORY" \
              -t "recon output" -n "Hasil bongkar Bunny Loader (otomatis)"

  managed:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Unduh APK dan ekstrak bagian penting
        run: |
          mkdir -p work/in work/bl out
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'bunny-loader.v0.4.0.apk' --dir work/in
          cd work/bl
          unzip -q -o ../in/bunny-loader.v0.4.0.apk \
            'assets/dotnet/BunnyLoader.dll' 'classes*.dex' AndroidManifest.xml
          ls -la . assets/dotnet

      - name: Dekompilasi BunnyLoader.dll (ILSpy)
        continue-on-error: true
        run: |
          dotnet tool install -g ilspycmd
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p out/csharp
          ilspycmd -p -o out/csharp work/bl/assets/dotnet/BunnyLoader.dll
          find out/csharp -type f | wc -l

      - name: Dekompilasi kode Kotlin/Java (jadx)
        continue-on-error: true
        run: |
          mkdir -p work/tools/jadx out/jadx
          gh release download -R skylot/jadx -p 'jadx-[0-9]*.zip' --dir work/tools
          unzip -q work/tools/jadx-*.zip -d work/tools/jadx
          work/tools/jadx/bin/jadx -d out/jadx --no-res -j 2 \
            work/bl/classes4.dex work/bl/classes6.dex work/bl/classes7.dex || true
          find out/jadx -type f | wc -l

      - name: Upload recon-managed.zip
        if: always()
        run: |
          cp work/bl/AndroidManifest.xml out/ || true
          cd out && zip -r -q ../recon-managed.zip . && cd ..
          ls -la recon-managed.zip
          gh release upload recon-output recon-managed.zip -R "$GITHUB_REPOSITORY" --clobber

  native:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unduh APK dan ekstrak libbunny.so
        run: |
          mkdir -p work/in work/bl out/ghidra
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'bunny-loader.v0.4.0.apk' --dir work/in
          cd work/bl
          unzip -q -o ../in/bunny-loader.v0.4.0.apk 'lib/arm64-v8a/libbunny.so'
          ls -la lib/arm64-v8a

      - name: Pasang Ghidra 11.3.2
        run: |
          mkdir -p work/tools
          curl -sSL --retry 3 -o work/tools/ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3.2_build/ghidra_11.3.2_PUBLIC_20250415.zip"
          unzip -q work/tools/ghidra.zip -d work/tools
          sed -i 's/^MAXMEM=.*/MAXMEM=4G/' work/tools/ghidra_11.3.2_PUBLIC/support/analyzeHeadless
          grep -n '^MAXMEM' work/tools/ghidra_11.3.2_PUBLIC/support/analyzeHeadless
          java -version
          free -m

      - name: Tulis skrip Ghidra
        run: |
          mkdir -p work/gscripts
          cat > work/gscripts/TuneAnalysis.java <<'JAVA'
          import ghidra.app.script.GhidraScript;

          public class TuneAnalysis extends GhidraScript {
            @Override
            public void run() throws Exception {
              String[] slow = { "Decompiler Parameter ID", "Decompiler Switch Analysis" };
              for (String opt : slow) {
                try {
                  setAnalysisOption(currentProgram, opt, "false");
                  println("dimatikan: " + opt);
                } catch (Exception e) {
                  println("opsi tidak ada: " + opt);
                }
              }
            }
          }
          JAVA
          cat > work/gscripts/DumpDecomp.java <<'JAVA'
          import ghidra.app.script.GhidraScript;
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.FunctionIterator;
          import java.io.PrintWriter;
          import java.io.FileWriter;

          public class DumpDecomp extends GhidraScript {
            @Override
            public void run() throws Exception {
              String outPath = getScriptArgs()[0];
              DecompInterface ifc = new DecompInterface();
              ifc.openProgram(currentProgram);
              PrintWriter out = new PrintWriter(new FileWriter(outPath));
              FunctionIterator it = currentProgram.getFunctionManager().getFunctions(true);
              int n = 0;
              int seen = 0;
              while (it.hasNext() && !monitor.isCancelled()) {
                Function f = it.next();
                seen++;
                if (f.isThunk() || f.isExternal()) continue;
                String name = f.getName();
                if (name.contains("__ndk1") || name.startsWith("_ZNSt") || name.startsWith("_ZNKSt")) continue;
                if (f.getBody().getNumAddresses() < 12) continue;
                DecompileResults r = ifc.decompileFunction(f, 20, monitor);
                if (r != null && r.decompileCompleted()) {
                  out.println("// ==== " + name + " @ " + f.getEntryPoint() + " ====");
                  out.println(r.getDecompiledFunction().getC());
                  out.flush();
                  n++;
                  if (n % 250 == 0) println("progress: " + n + " fungsi (dilihat " + seen + ")");
                }
              }
              out.close();
              println("Selesai. Fungsi didekompilasi: " + n + " dari " + seen);
            }
          }
          JAVA
          ls -la work/gscripts

      - name: Dekompilasi libbunny.so (Ghidra)
        continue-on-error: true
        run: |
          mkdir -p work/gproj
          GH_HOME="$PWD/work/tools/ghidra_11.3.2_PUBLIC"
          nice -n 10 "$GH_HOME/support/analyzeHeadless" "$PWD/work/gproj" bunny \
            -import work/bl/lib/arm64-v8a/libbunny.so \
            -scriptPath "$PWD/work/gscripts" \
            -preScript TuneAnalysis.java \
            -postScript DumpDecomp.java "$PWD/out/ghidra/libbunny_decompiled.c" \
            -analysisTimeoutPerFile 5400 -deleteProject > out/ghidra/ghidra.log 2>&1 &
          PID=$!
          while kill -0 "$PID" 2>/dev/null; do
            sleep 60
            echo "[$(date +%T)] Ghidra masih jalan | RAM terpakai: $(free -m | awk 'NR==2{print $3}') MB | keluaran: $(du -h out/ghidra 2>/dev/null | tail -1 | cut -f1)"
          done
          wait "$PID" || echo "Ghidra selesai dengan kode $?"
          tail -n 30 out/ghidra/ghidra.log
          ls -la out/ghidra

      - name: Upload recon-native.zip
        if: always()
        run: |
          cd out && zip -r -q ../recon-native.zip . && cd ..
          ls -la recon-native.zip
          gh release upload recon-output recon-native.zip -R "$GITHUB_REPOSITORY" --clobber
